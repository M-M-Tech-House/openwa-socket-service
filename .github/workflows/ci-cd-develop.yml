name: CI/CD develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-develop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Verify liveness probe
        run: |
          node -e '
            const { server } = require("./dist/main.js");
            setTimeout(async () => {
              try {
                const res = await fetch("http://127.0.0.1:3100/health");
                const data = await res.json();
                console.log("Health check verified:", data);
                server.close();
                process.exit(data.status === "ok" ? 0 : 1);
              } catch(e) {
                console.error(e);
                server.close();
                process.exit(1);
              }
            }, 600);
          '

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:develop
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Webhook Deploy (Optional)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DEPLOY_WEBHOOK_URL"
